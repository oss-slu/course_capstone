# What each role is evaluated against. Verbatim from the syllabus's "Final Grade
# Breakdown" (CSCI 4961/4962/5960, 2026-08-19), with the descriptions condensed
# from its "Detailed Grade Component Descriptions".
#
# Declared here rather than in the codehort's activity.yaml because a rubric is
# per role and a role sits in one course. Tech leads are evaluated against a
# different five components, declared in course_dossp.
#
# These are weights, not a scoring scheme. The syllabus names **professional
# judgment** as the assessment approach and publishes no bands or point values
# per component, which is deliberate: a weight says how much a component matters
# to the whole, not how to compute it. Nothing multiplies these.
rubrics:
  developer:
    stretch_category: excellence
    categories:
      - id: discovery
        name: Discovery
        weight: 0.20
        description: >-
          Engagement with understanding project requirements, exploring solution
          approaches, and investigating technical challenges: client meetings,
          research, initial designs, documented findings.
        # Deliberately empty. Client meetings, research and initial designs
        # land nowhere this pipeline reads, so the document says that at the
        # component. 20% of the grade on instructor observation alone is worth
        # a reader seeing plainly rather than inferring from a short section.
        evidence: []
      - id: delivery
        name: Delivery
        weight: 0.25
        description: >-
          Completed work that advances project goals and meets quality
          standards: merged pull requests, implemented features, resolved
          issues, documented solutions.
        # Merged pull requests, implemented features, commits -- which is what
        # the syllabus's own description of Delivery names.
        evidence: [activity]
      - id: collaboration
        name: Collaboration
        weight: 0.15
        description: >-
          Effectiveness as a team member through code reviews, retrospective
          participation, communication quality, and support for teammates.
        # Code reviews, from version control. Retrospective participation and
        # communication quality are the other half of what the syllabus names
        # here, and `chat` is declared so the document states that no chat
        # provider was collected rather than leaving a silence to be read as a
        # zero.
        evidence: [activity, chat]
      - id: demonstration
        name: Demonstration
        weight: 0.15
        description: >-
          Ability to showcase and explain work through demo videos,
          presentations, and live demonstrations, for varied audiences.
        # The demo videos and written reports collected per sprint close.
        evidence: [demos]
      - id: client_satisfaction
        name: Client Satisfaction
        weight: 0.15
        description: >-
          Client feedback on progress, communication effectiveness, and
          responsiveness to requirements. Arrives out of band from clients.
        # Empty: client feedback arrives out of band and nothing collects it.
        evidence: []
      - id: excellence
        name: Excellence
        weight: 0.10
        description: >-
          Exceptional contributions significantly beyond baseline expectations:
          mentoring, open source community contributions, innovative solutions,
          leadership in team processes. Student-documented.

        # Empty: student-documented, on personal sites and project blogs, and
        # excluded from the midterm in any case.
        evidence: []